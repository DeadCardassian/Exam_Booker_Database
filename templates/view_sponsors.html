<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Exam Booker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_final.css') }}">
</head>
<body>
    <div class="topbar">
        <header>
            <a class="logo" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     style="width:100px; height:100px; vertical-align:middle;">
                EXAM BOOKER
            </a>

            <nav>
                <a class="aboutus" href="{{ url_for('about') }}">About Us</a>
                <a class="btn yellowb circle" href="{{ url_for('login') }}">Login</a>
                <a class="btn yellowb circle" href="{{ url_for('create_user') }}">Register</a>
            </nav>
        </header>
    </div>

    <div class="container">
        <main>
            <div class="card cream_bg">

                <div class="header blue_bg">
                    <h1 style="color:var(--cream)">Our Exam Sponsors</h1>
                </div>

                <p style="color:var(--grey)">
                    {% for s in sponsors %}
                        {{ s.sponsor_name }}<br>   
                     {% endfor %}
                </p>

            </div>
        </main>

        <footer>
             &copy; <span id="year"></span> ExamBooker
        </footer>
    </div>

    <script>
        // gets current year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
